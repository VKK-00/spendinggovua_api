name: temporary-psh09d1-verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/psh09d1_verify.yml'
      - '.github/scripts/psh09d1_verify.py'
      - '.github/psh09d1/selected_cases.txt'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SNAPSHOT_URL: https://data.gov.ua/dataset/0ad60ea9-b029-456d-abc0-8c77a99b205c/resource/b1d5b6b3-d1fa-4c20-887b-6fa357ca17ed/revision/514021/download
      EDRSR_2024_URL: https://data.gov.ua/dataset/1a6b5c08-0879-4387-8878-ac0027494274/resource/d3427d17-3fe4-4675-9a09-5274cd3476dc/download/edrsr_data_2024.zip
      EDRSR_2025_URL: https://data.gov.ua/dataset/2a95ae17-ed46-42ae-ad66-dd9b7a727bb7/resource/9f19ad2b-000f-4176-b283-95e399ad8e5e/download/edrsr_data_2025.zip
      EDRSR_2026_URL: https://data.gov.ua/dataset/16ab7f06-7414-405f-8354-0a492475272d/resource/b1a4ac1c-b17a-4988-8e6d-dedae8b2dd63/download/edrsr_data_2026.zip
    steps:
      - name: Check out verification files
        uses: actions/checkout@v4

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Download frozen official sources
        shell: bash
        run: |
          set -euo pipefail
          download() {
            local url="$1" out="$2"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --connect-timeout 30 --max-time 10800 "$url" -o "$out"
            ls -lh "$out"
            file "$out"
          }
          download "$SNAPSHOT_URL" snapshot.zip
          download "$EDRSR_2024_URL" edrsr_2024.zip
          download "$EDRSR_2025_URL" edrsr_2025.zip
          download "$EDRSR_2026_URL" edrsr_2026.zip
          sha256sum snapshot.zip edrsr_2024.zip edrsr_2025.zip edrsr_2026.zip

      - name: Reconstruct official evidence for fixed sample
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/psh09d1_verify.py \
            --snapshot snapshot.zip \
            --selected .github/psh09d1/selected_cases.txt \
            --edrsr 2024 edrsr_2024.zip \
            --edrsr 2025 edrsr_2025.zip \
            --edrsr 2026 edrsr_2026.zip \
            --out verify_out
          sha256sum verify_out/* | tee verify_out/output_sha256.txt
          wc -l verify_out/*.csv
          cat verify_out/verification_meta.json

      - name: Upload compact verification result
        uses: actions/upload-artifact@v4
        with:
          name: psh09d1-verification
          path: verify_out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
