name: PSH-09-D2 bounded EDRSR review

on:
  push:
    branches:
      - chatgpt/psh09d2-20260810
    paths:
      - 'psh09d2/review_selected.py'
      - 'psh09d2/review_targets.b64'
      - '.github/workflows/psh09d2_review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded review dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.4 striprtf==0.0.29
      - name: Retrieve selected official open EDRSR texts
        run: python psh09d2/review_selected.py
      - name: Upload review evidence
        uses: actions/upload-artifact@v4
        with:
          name: psh09d2-review-evidence
          path: psh09d2/review_output/
          if-no-files-found: error
          retention-days: 1
